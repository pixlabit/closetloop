services:
  postgres:
    image: postgres:18-alpine
    container_name: desire-wardrobe-db
    restart: unless-stopped
    ports:
      - '5437:5432'
    environment:
      POSTGRES_USER: desire
      POSTGRES_PASSWORD: desire123
      POSTGRES_DB: desire-wardrobe
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
